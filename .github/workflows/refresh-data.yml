name: Refresh market data

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (UTC)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch calendar, prices and news
        run: node scripts/refresh.mjs
      - name: Save data.json
        run: |
          git config user.name "NewsTrade updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh market data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
